[package]
name = "pilotq"
version = "0.2.39"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
coreq = { git = "https://github.com/taskqorg/coreq", tag = "v0.18.0" }
agentq-runtime = { git = "https://github.com/taskqorg/agentq", rev = "513193c8a96f3de1c71a86291a679230817ce0b2" }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
teloxide = { version = "0.17.0", default-features = false, features = ["rustls"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync"] }
url = "2"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
lopdf = { version = "0.46.0", default-features = false }
crc32fast = "1"
