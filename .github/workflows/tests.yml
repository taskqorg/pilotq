name: tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check specification files and whitespace
        run: |
          test -s README.md
          test -s AGENTS.md
          test -s pilotq.md
          test -s docs/research.md
          test -s docs/acceptance.md
          test -s docs/projects.md
          git show --format= --check HEAD
      - run: rustup update stable --no-self-update && rustup default stable
      - name: cargo checks
        run: |
          cargo test --locked
          # a test that leaves its service running fails the build, even when the test itself passed
          if pgrep -fl "^$PWD/target/[^ ]*/pilotq service run"; then echo "tests left pilotq service run alive"; exit 1; fi
          cargo run --locked -- selftest
