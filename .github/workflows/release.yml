# pilotq.md §9: only the owner's live push releases; PR and merge queue verify the same artifact.
name: release
on:
  push:
    branches: [live]
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    env:
      PILOTQ_SELFTEST_OFFLINE: '1'
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Release source
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" \
            -f event=merge_group -f head_sha="$GITHUB_SHA" -f per_page=100 > merge-runs.json
          python3 - <<'PYTHON'
          import json, os
          runs = json.load(open('merge-runs.json'))['workflow_runs']
          for name in ('tests', 'release'):
              matching = [r for r in runs if r['name'] == name and r['head_sha'] == os.environ['GITHUB_SHA'] and r['event'] == 'merge_group']
              assert matching, f'{name}: no merge-result CI'
              latest = max(matching, key=lambda r: (r['run_number'], r['run_attempt']))
              assert latest['status'] == 'completed' and latest['conclusion'] == 'success', f'{name}: merge-result CI not green'
          PYTHON
          if [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            git merge-base --is-ancestor "$BEFORE" "$GITHUB_SHA"
          fi
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup update stable --no-self-update && rustup default stable && rustup target add "$TARGET"
      - name: Read release version
        run: |
          ver="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VER=$ver" >> "$GITHUB_ENV"
      - if: github.event_name == 'push'
        run: cargo test --locked
      - run: cargo build --locked --release --target "$TARGET"
      - name: Stage integrity metadata
        run: |
          bin="target/$TARGET/release/pilotq"
          file "$bin" | grep -Eq 'static(ally|-pie) linked'
          mkdir dist
          cp "$bin" "dist/pilotq-$VER-linux-x86_64"
          python3 - <<'PY'
          import json, os
          v = os.environ['VER']
          with open('dist/latest.json', 'w') as f:
              json.dump({'version': v, 'files': {'linux-x86_64': f'pilotq-{v}-linux-x86_64'}, 'source_commit': os.environ['GITHUB_SHA']}, f)
          PY
          (cd dist && sha256sum pilotq-* latest.json > SHA256SUMS)
      - name: Verify artifact before publication
        run: scripts/verify-release.sh dist "$VER"
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          ver="$(python3 -c 'import json; print(json.load(open("dist/latest.json"))["version"])')"
          gh release create "v$ver" dist/* --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
            --title "PilotQ v$ver" --notes "First PilotQ release for TaskQ work. Install and test: https://github.com/$GITHUB_REPOSITORY/blob/v$ver/docs/tester-guide.md. Production cutover remains unqualified."
